name: symphonia
description: "An intimate companion app for couples - Symphonia"
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Navigation
  go_router: ^17.0.1

  # Local Storage
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  path: ^1.9.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4

  # Networking
  http: ^1.2.0

  # UI Components
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  confetti: ^0.8.0
  google_fonts: ^6.2.1

  # Audio Recording & Playback
  record: ^6.1.2
  just_audio: ^0.10.5
  audio_video_progress_bar: ^2.0.3

  # Vibration & Haptics
  vibration: ^3.1.4

  # Permissions
  permission_handler: ^12.0.1

  # Biometric Authentication
  local_auth: ^2.3.0

  # Image Handling
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # Location & Maps
  geolocator: ^13.0.1
  google_maps_flutter: ^2.10.0

  # Date & Time
  intl: ^0.20.2
  timezone: ^0.10.0

  # Notifications
  flutter_local_notifications: ^19.0.0

  # Ringtone Player (for ring phone feature)
  flutter_ringtone_player: ^4.0.0+3

  # Rich Text Editing
  flutter_quill: ^11.5.0

  # Emoji Picker
  emoji_picker_flutter: ^4.4.0

  # Utilities
  uuid: ^4.5.1
  equatable: ^2.0.7
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  very_good_analysis: ^10.0.0

  # Launcher icon generation
  flutter_launcher_icons: ^0.14.4

  # Code Generation
  build_runner: ^2.4.15
  riverpod_generator: ^3.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
